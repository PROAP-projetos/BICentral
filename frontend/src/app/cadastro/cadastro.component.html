<div class="form-container">
  <div *ngIf="!registrationSuccess; else successMessage">
    <form (ngSubmit)="cadastrar()">
      <h2>Crie sua Conta</h2>
      <div class="log-wrapper" *ngIf="message">
        <div class="premium-alert" [ngClass]="messageType">
          <div class="alert-icon-wrapper">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="alert-icon">
              <path fill-rule="evenodd" d="M2.25 12c0-5.385 4.365-9.75 9.75-9.75s9.75 4.365 9.75 9.75-4.365 9.75-9.75 9.75S2.25 17.385 2.25 12Zm8.25-3a1.5 1.5 0 1 1 3 0v3a1.5 1.5 0 1 1-3 0V9Zm1.5 8.25a1.125 1.125 0 1 0 0-2.25 1.125 1.125 0 0 0 0 2.25Z" clip-rule="evenodd" />
            </svg>
          </div>
          <div class="alert-content">
            <h4 class="alert-title">{{ alertTitle }}</h4>
            <p class="alert-message">{{ message }}</p>
            <a *ngIf="showLoginShortcut" routerLink="/login" class="alert-action-link">Ir para Login</a>
          </div>
        </div>
      </div>
      <div class="form-group">
        <label for="username">Nome de usuário</label>
        <input type="text" id="username" [(ngModel)]="usuario.username" name="username" required>
      </div>
      <div class ="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" [(ngModel)]="usuario.email" name ="email" required>
      </div>
      <div class="form-group">
        <label for="password">Senha</label>
        <input type="password" id="password" [(ngModel)]="usuario.password" name="password" required>
      </div>
      <button type="submit" class="btn btn-primary">Cadastrar</button>
      <div class="footer-link">
        <a routerLink="/">Voltar para a Home</a>
      </div>
    </form>
  </div>
  <ng-template #successMessage>
    <div class="card">
      <h2>Cadastro realizado com sucesso!</h2>
      <div class="log-wrapper">
        <div class="premium-alert success">
          <div class="alert-icon-wrapper">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="alert-icon">
              <path fill-rule="evenodd" d="M2.25 12c0-5.385 4.365-9.75 9.75-9.75s9.75 4.365 9.75 9.75-4.365 9.75-9.75 9.75S2.25 17.385 2.25 12Zm13.36-1.814a.75.75 0 1 0-1.22-.872l-3.236 4.53-1.6-1.6a.75.75 0 1 0-1.06 1.06l2.25 2.25a.75.75 0 0 0 1.14-.094l3.75-5.25Z" clip-rule="evenodd" />
            </svg>
          </div>
          <div class="alert-content">
            <h4 class="alert-title">Sucesso</h4>
            <p class="alert-message">{{ message }}</p>
          </div>
        </div>
      </div>
      <div class="footer-link">
        <a routerLink="/">Voltar para a Home</a>
      </div>
    </div>
  </ng-template>
</div>
