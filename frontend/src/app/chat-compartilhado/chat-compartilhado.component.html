<div class="compartilhado-shell">
  <header class="compartilhado-header">
    <div class="compartilhado-logo">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"></path>
      </svg>
      <span>pro<strong>IA</strong>p</span>
    </div>
    <span class="compartilhado-badge">Conversa compartilhada · somente leitura</span>
  </header>

  <main class="compartilhado-body">
    <p class="compartilhado-carregando" *ngIf="carregando">Carregando...</p>
    <p class="compartilhado-erro" *ngIf="erro">Esse link é inválido ou a conversa foi apagada.</p>

    <ng-container *ngIf="!carregando && !erro">
      <h1 class="compartilhado-titulo">{{ titulo }}</h1>

      <div class="compartilhado-mensagem" *ngFor="let m of mensagens" [ngClass]="m.remetente">
        <div class="compartilhado-bolha">
          <p class="compartilhado-texto">{{ m.texto }}</p>
          <div class="compartilhado-grafico" *ngIf="m.spec">
            <app-grafico-ia *ngFor="let g of m.spec.graficos" [spec]="g"></app-grafico-ia>
          </div>
        </div>
      </div>
    </ng-container>
  </main>
</div>
