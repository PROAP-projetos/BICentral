<section class="card">
  <div class="card-header">
    <h2>Limites de Notificacao</h2>
    <span class="hint" *ngIf="carregando">Carregando...</span>
  </div>

  <form class="form-compact notification-form" (ngSubmit)="salvar()">
    <label>
      Limite baixo (%)
      <input
        type="number"
        min="0"
        max="100"
        step="0.01"
        [(ngModel)]="limiteBaixoPct"
        name="limiteBaixoPct"
        required />
    </label>

    <label>
      Limite bom (%)
      <input
        type="number"
        min="0"
        max="100"
        step="0.01"
        [(ngModel)]="limiteBomPct"
        name="limiteBomPct"
        required />
    </label>

    <button
      class="btn btn-primary btn-sm"
      type="submit"
      [disabled]="carregando || salvando || limiteBaixoPct === null || limiteBomPct === null">
      Salvar
    </button>
  </form>
</section>
