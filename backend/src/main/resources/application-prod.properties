spring.application.name=bicentral-backend

# Conexão com Supabase (PostgreSQL) — valores vêm de variáveis de ambiente no Render
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Config do JPA
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Email (Brevo)
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${BREVO_SMTP_USERNAME}
spring.mail.password=${BREVO_SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Render injeta a porta real nessa variável — não fixar em 8080
server.port=${PORT:8080}

# URL pública do frontend (usada nos links de convite e liberada no CORS)
app.frontend-base-url=${FRONTEND_BASE_URL}

# Supabase Storage
supabase.url=${SUPABASE_URL}
supabase.key=${SUPABASE_ANON_KEY}
supabase.bucket=uploads
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY}

# Hikari cabe dentro do limite do Supabase
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.max-lifetime=30000
spring.datasource.hikari.connection-timeout=20000

# Chave secreta do JWT
jwt.secret=${JWT_SECRET}

# Convites de equipe
convite.equipe.expiracao-horas=72

# Modelos de IA
langchain4j.google-ai-gemini.api-key=${GEMINI_API_KEY}
groq.api.key=${GROQ_API_KEY:}
cerebras.api.key=${CEREBRAS_API_KEY:}
sambanova.api.key=${SAMBANOVA_API_KEY:}
openrouter.api.key=${OPENROUTER_API_KEY:}
openai.api.key=${OPENAI_API_KEY:}

# Ollama não existe no Render — fica com default, sem uso em produção
ollama.base.url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.model.name=${OLLAMA_MODEL_NAME:llama3.1}
ollama.embedding.model.name=${OLLAMA_EMBEDDING_MODEL_NAME:nomic-embed-text}

uft.sync.enabled=false
