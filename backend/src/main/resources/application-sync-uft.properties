# Modo "roda e sai" pra sincronizar PAT/Tarefas manualmente (ver SincronizacaoUftRunner) — sem
# subir servidor web, sem repetir sozinho. Roda com --spring.profiles.active=sync-uft, sempre
# junto do application.properties normal (mesma conexão de banco, é o mesmo Supabase de produção).
spring.main.web-application-type=none
uft.sync.enabled=true

# A fase "fetch" não usa banco nenhum (só a API da UFT) — mas sem isto, o Hibernate tenta abrir
# uma conexão com o banco JÁ NA INICIALIZAÇÃO (pra detectar dialeto/versão), e o processo inteiro
# falha antes mesmo de chegar no código da fase, mesmo numa fase que nunca ia precisar de banco.
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.hibernate.ddl-auto=none
spring.datasource.hikari.initialization-fail-timeout=-1
